<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Une todo liste toute mignonne">
  <meta name="theme-color" content="#fff4f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#241b31" media="(prefers-color-scheme: dark)">
  <title>Mochi Todo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <svg class="mochi" viewBox="0 0 120 100" aria-hidden="true" data-mood="sleepy">
        <path d="M30 42 L35 14 L56 30 Z M90 42 L85 14 L64 30 Z" fill="#fff" stroke="#f3a5c5" stroke-width="3" stroke-linejoin="round"/>
        <path d="M36 34 L38.5 22 L48 30 Z M84 34 L81.5 22 L72 30 Z" fill="#ffc4dc"/>
        <path d="M10 70 C10 42 32 27 60 27 C88 27 110 42 110 70 C110 88 92 95 60 95 C28 95 10 88 10 70 Z" fill="#fff" stroke="#f3a5c5" stroke-width="3"/>
        <ellipse cx="33" cy="72" rx="8" ry="4.5" fill="#ffb3d1"/>
        <ellipse cx="87" cy="72" rx="8" ry="4.5" fill="#ffb3d1"/>
        <g class="m-normal">
          <circle cx="44" cy="62" r="5" fill="#4b3a55"/>
          <circle cx="76" cy="62" r="5" fill="#4b3a55"/>
          <circle cx="45.8" cy="60.2" r="1.7" fill="#fff"/>
          <circle cx="77.8" cy="60.2" r="1.7" fill="#fff"/>
          <path d="M54 70 q3 4 6 0 q3 4 6 0" fill="none" stroke="#4b3a55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="m-happy" fill="none" stroke="#4b3a55" stroke-width="3" stroke-linecap="round">
          <path d="M38 64 q6 -9 12 0 M70 64 q6 -9 12 0"/>
          <path d="M53 69 Q60 80 67 69 Z" fill="#ff7eb3" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <g class="m-sleepy" fill="none" stroke="#4b3a55" stroke-width="3" stroke-linecap="round">
          <path d="M38 62 q6 5 12 0 M70 62 q6 5 12 0"/>
          <circle cx="60" cy="73" r="2.5" fill="#4b3a55" stroke="none"/>
          <text x="96" y="26" font-size="14" font-weight="800" fill="#b28dff" stroke="none">z</text>
          <text x="106" y="13" font-size="10" font-weight="800" fill="#b28dff" stroke="none">z</text>
        </g>
      </svg>
      <div>
        <h1>Mochi Todo</h1>
        <p class="bubble" id="mood" aria-live="polite"></p>
      </div>
    </header>

    <div class="progress" id="progress" role="progressbar" aria-label="Progression du jour" data-i18n-label="progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill"></div>
    </div>

    <form class="add" id="add-form">
      <input id="new-task" type="text" maxlength="120" autocomplete="off" enterkeyhint="done"
             placeholder="Une nouvelle mission ✨" aria-label="Nouvelle tâche" data-i18n-label="newTaskLabel">
      <button type="submit" aria-label="Ajouter" data-i18n-label="add">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
      </button>
    </form>

    <nav class="filters" aria-label="Filtrer" data-i18n-label="filter">
      <button type="button" data-filter="all" data-i18n="all">Toutes</button>
      <button type="button" data-filter="todo" data-i18n="todo">À faire</button>
      <button type="button" data-filter="doing" data-i18n="doing">En cours</button>
      <button type="button" data-filter="done" data-i18n="done">Finies</button>
    </nav>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
    <p class="hint" id="hint" data-i18n="hint" hidden>Astuce : une grosse mission sur plusieurs jours ? Touche 🌙 quand tu as avancé dessus, elle compte comme une victoire du jour et revient demain.</p>

    <footer class="footer">
      <span id="count"></span>
      <button type="button" class="link" id="clear-done" data-i18n="clearDone">Nettoyer les finies 🧹</button>
    </footer>
  </main>

  <template id="item-tpl">
    <li class="item">
      <button type="button" class="check"></button>
      <div class="body">
        <button type="button" class="text"></button>
        <span class="chip"></span>
      </div>
      <button type="button" class="later">🌙</button>
      <button type="button" class="delete" aria-label="Supprimer" data-i18n-label="delete">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
    </li>
  </template>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
